name: Build and Publish FFmpeg Binaries

'on':
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: Force build even if the repo tag already exists
        required: false
        default: false
        type: boolean
      release_tag:
        description: Specific FFmpeg tag to build (leave empty for latest stable)
        required: false
        type: string

jobs:
  check-and-build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      should_build_any: ${{ steps.check-release.outputs.should_build_any }}
      should_build_amd64: ${{ steps.check-release.outputs.should_build_amd64 }}
      should_build_arm64: ${{ steps.check-release.outputs.should_build_arm64 }}
      should_build_armv7: ${{ steps.check-release.outputs.should_build_armv7 }}
      release_tag: ${{ steps.check-release.outputs.release_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for new FFmpeg release
        id: check-release
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ github.event.inputs.force_build || 'false' }}
          MANUAL_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euxo pipefail

          echo "should_build_amd64=false" >> "$GITHUB_OUTPUT"
          echo "should_build_arm64=false" >> "$GITHUB_OUTPUT"
          echo "should_build_armv7=false" >> "$GITHUB_OUTPUT"
          echo "should_build_any=false" >> "$GITHUB_OUTPUT"

          RELEASE_TAG=""
          if [ -n "$MANUAL_TAG" ]; then
            RELEASE_TAG="$MANUAL_TAG"
            echo "Using manually specified release: $RELEASE_TAG"
          else
            for attempt in 1 2 3; do
              if RELEASE_TAG="$(git ls-remote --tags --refs https://github.com/FFmpeg/FFmpeg.git 'refs/tags/n*' \
                    | awk '{print $2}' | sed 's#refs/tags/##' \
                    | grep -Ev -- '-dev$|-rc[0-9]*$' \
                    | sort -V | tail -n 1)" && [ -n "$RELEASE_TAG" ]; then
                break
              fi
              echo "Failed to resolve latest FFmpeg release on attempt $attempt; retrying..."
              if [ "$attempt" -eq 3 ]; then
                echo "Unable to determine latest upstream FFmpeg tag after 3 attempts"
                exit 0
              fi
              sleep 5
            done
          fi

          if [ -z "$RELEASE_TAG" ]; then
            echo "Invalid release tag resolved"
            echo "Bailing out: upstream release tag could not be determined reliably"
            exit 0
          fi

          echo "Latest FFmpeg release: $RELEASE_TAG"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists in this repo"
            if [ "$FORCE_BUILD" != "true" ]; then
              for asset_attempt in 1 2 3; do
                if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' >/tmp/release-assets.txt 2>/tmp/gh_release_assets.err; then
                  for arch in amd64 arm64 armv7; do
                    case "$arch" in
                      amd64)
                        ASSET="ffmpeg-${RELEASE_TAG}-linux-amd64.tar.gz"
                        ;;
                      arm64)
                        ASSET="ffmpeg-${RELEASE_TAG}-linux-arm64.tar.gz"
                        ;;
                      armv7)
                        ASSET="ffmpeg-${RELEASE_TAG}-linux-armv7.tar.gz"
                        ;;
                    esac

                    if grep -Fxq "$ASSET" /tmp/release-assets.txt; then
                      echo "$arch asset already exists for $RELEASE_TAG"
                    else
                      echo "$arch asset missing from $RELEASE_TAG; rebuilding it"
                      case "$arch" in
                        amd64) echo "should_build_amd64=true" >> "$GITHUB_OUTPUT" ;;
                        arm64) echo "should_build_arm64=true" >> "$GITHUB_OUTPUT" ;;
                        armv7) echo "should_build_armv7=true" >> "$GITHUB_OUTPUT" ;;
                      esac
                    fi
                  done

                  for arch_flag in should_build_amd64 should_build_arm64 should_build_armv7; do
                    if grep -q "^${arch_flag}=true$" "$GITHUB_OUTPUT"; then
                      echo "should_build_any=true" >> "$GITHUB_OUTPUT"
                      break
                    fi
                  done

                  exit 0
                fi

                echo "Failed to fetch release assets for $RELEASE_TAG on attempt $asset_attempt; retrying..."
                if [ "$asset_attempt" -eq 3 ]; then
                  echo "Unable to confirm release asset state for $RELEASE_TAG after 3 attempts; bailing out to avoid invalid state"
                  exit 0
                fi
                sleep 5
              done
            fi
          fi

          echo "should_build_amd64=true" >> "$GITHUB_OUTPUT"
          echo "should_build_arm64=true" >> "$GITHUB_OUTPUT"
          echo "should_build_armv7=true" >> "$GITHUB_OUTPUT"
          echo "should_build_any=true" >> "$GITHUB_OUTPUT"

  build-amd64:
    needs: check-and-build
    if: needs.check-and-build.outputs.should_build_amd64 == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build FFmpeg for amd64
        run: |
          set -euxo pipefail
          chmod +x ./build.sh
          ./build.sh "${{ needs.check-and-build.outputs.release_tag }}" amd64

      - name: Validate amd64 artifact
        run: |
          set -euxo pipefail
          archive="build/ffmpeg-${{ needs.check-and-build.outputs.release_tag }}-linux-amd64.tar.gz"
          test -f "$archive"
          ls -lh "$archive"

      - name: Upload amd64 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-amd64
          path: build/ffmpeg-${{ needs.check-and-build.outputs.release_tag }}-linux-amd64.tar.gz
          retention-days: 30

  build-arm64:
    needs: check-and-build
    if: needs.check-and-build.outputs.should_build_arm64 == 'true'
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build FFmpeg for arm64
        run: |
          set -euxo pipefail
          chmod +x ./build.sh
          ./build.sh "${{ needs.check-and-build.outputs.release_tag }}" arm64

      - name: Validate arm64 artifact
        run: |
          set -euxo pipefail
          archive="build/ffmpeg-${{ needs.check-and-build.outputs.release_tag }}-linux-arm64.tar.gz"
          test -f "$archive"
          ls -lh "$archive"

      - name: Upload arm64 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-arm64
          path: build/ffmpeg-${{ needs.check-and-build.outputs.release_tag }}-linux-arm64.tar.gz
          retention-days: 30

  build-armv7:
    needs: check-and-build
    if: needs.check-and-build.outputs.should_build_armv7 == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install armv7 cross-toolchain
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install --reinstall --no-install-recommends -y \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            libc6-dev-armhf-cross \
            binutils-arm-linux-gnueabihf \
            qemu-user-static

          arm-linux-gnueabihf-gcc --version
          arm-linux-gnueabihf-g++ --version

      - name: Build FFmpeg for armv7
        run: |
          set -euxo pipefail
          chmod +x ./build.sh
          ./build.sh "${{ needs.check-and-build.outputs.release_tag }}" armv7

      - name: Validate armv7 artifact
        run: |
          set -euxo pipefail
          archive="build/ffmpeg-${{ needs.check-and-build.outputs.release_tag }}-linux-armv7.tar.gz"
          test -f "$archive"
          ls -lh "$archive"

      - name: Upload armv7 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-armv7
          path: build/ffmpeg-${{ needs.check-and-build.outputs.release_tag }}-linux-armv7.tar.gz
          retention-days: 30

  publish:
    needs: [check-and-build, build-amd64, build-arm64, build-armv7]
    if: >-
      always() && needs.check-and-build.outputs.should_build_any == 'true' &&
      (needs.build-amd64.result == 'success' || needs.build-amd64.result == 'skipped') &&
      (needs.build-arm64.result == 'success' || needs.build-arm64.result == 'skipped') &&
      (needs.build-armv7.result == 'success' || needs.build-armv7.result == 'skipped')
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download amd64 artifact
        if: needs.build-amd64.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-amd64
          path: /tmp/artifacts/amd64

      - name: Download arm64 artifact
        if: needs.build-arm64.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-arm64
          path: /tmp/artifacts/arm64

      - name: Download armv7 artifact
        if: needs.build-armv7.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-armv7
          path: /tmp/artifacts/armv7

      - name: Generate release BOM from dependencies.lock
        run: |
          set -euxo pipefail

          RELEASE_TAG="${{ needs.check-and-build.outputs.release_tag }}"
          BOM_FILE="/tmp/artifacts/ffmpeg-${RELEASE_TAG}-dependencies.bom.txt"
          RELEASE_NOTES_FILE="/tmp/artifacts/ffmpeg-${RELEASE_TAG}-release-notes.md"

          # shellcheck source=/dev/null
          source ./dependencies.lock

          {
            echo "FFmpeg Release BOM"
            echo "Release tag: $RELEASE_TAG"
            echo "Generated from: dependencies.lock"
            echo
            printf '%-14s %-55s %s\n' "Dependency" "Repository" "Tag/Ref"
            printf '%-14s %-55s %s\n' "----------" "----------" "-------"
            printf '%-14s %-55s %s\n' "zlib" "$ZLIB_REPO" "$ZLIB_TAG"
            printf '%-14s %-55s %s\n' "libogg" "$LIBOGG_REPO" "$LIBOGG_TAG"
            printf '%-14s %-55s %s\n' "libvorbis" "$LIBVORBIS_REPO" "$LIBVORBIS_TAG"
            printf '%-14s %-55s %s\n' "opus" "$OPUS_REPO" "$OPUS_TAG"
            printf '%-14s %-55s %s\n' "lame" "$LAME_REPO" "$LAME_TAG"
            printf '%-14s %-55s %s\n' "libvpx" "$LIBVPX_REPO" "$LIBVPX_TAG"
            printf '%-14s %-55s %s\n' "libaom" "$LIBAOM_REPO" "$LIBAOM_TAG"
            printf '%-14s %-55s %s\n' "dav1d" "$DAV1D_REPO" "$DAV1D_TAG"
            printf '%-14s %-55s %s\n' "x264" "$X264_REPO" "$X264_REF"
            printf '%-14s %-55s %s\n' "x265" "$X265_REPO" "$X265_TAG"
            printf '%-14s %-55s %s\n' "expat" "$EXPAT_REPO" "$EXPAT_TAG"
            printf '%-14s %-55s %s\n' "freetype" "$FREETYPE_REPO" "$FREETYPE_TAG"
            printf '%-14s %-55s %s\n' "harfbuzz" "$HARFBUZZ_REPO" "$HARFBUZZ_TAG"
            printf '%-14s %-55s %s\n' "fribidi" "$FRIBIDI_REPO" "$FRIBIDI_TAG"
            printf '%-14s %-55s %s\n' "fontconfig" "$FONTCONFIG_REPO" "$FONTCONFIG_TAG"
            printf '%-14s %-55s %s\n' "libass" "$LIBASS_REPO" "$LIBASS_TAG"
            echo
            echo "Raw lock file contents:"
            cat ./dependencies.lock
          } > "$BOM_FILE"

          FFMPEG_RELEASE_URL="https://github.com/FFmpeg/FFmpeg/releases/tag/${RELEASE_TAG}"

          {
            echo "# FFmpeg ${RELEASE_TAG} (GPL)"
            echo
            echo "Upstream FFmpeg release: [${RELEASE_TAG}](${FFMPEG_RELEASE_URL})"
            echo
            echo "Contains statically linked \`ffmpeg\` and \`ffprobe\` only, built with"
            echo "\`--enable-gpl\`. See [dependencies.lock](../../blob/main/dependencies.lock) or the"
            echo "attached \`dependencies.bom.txt\` asset for the full build BOM."
          } > "$RELEASE_NOTES_FILE"

          ls -lh "$BOM_FILE"
          ls -lh "$RELEASE_NOTES_FILE"


      - name: Create release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail

          RELEASE_TAG="${{ needs.check-and-build.outputs.release_tag }}"
          AMD64_ARCHIVE="/tmp/artifacts/amd64/ffmpeg-${RELEASE_TAG}-linux-amd64.tar.gz"
          ARM64_ARCHIVE="/tmp/artifacts/arm64/ffmpeg-${RELEASE_TAG}-linux-arm64.tar.gz"
          ARMV7_ARCHIVE="/tmp/artifacts/armv7/ffmpeg-${RELEASE_TAG}-linux-armv7.tar.gz"
          BOM_FILE="/tmp/artifacts/ffmpeg-${RELEASE_TAG}-dependencies.bom.txt"
          RELEASE_NOTES_FILE="/tmp/artifacts/ffmpeg-${RELEASE_TAG}-release-notes.md"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' >/tmp/release-assets.txt

            UPLOAD_ARGS=()
            for asset in "$BOM_FILE" "$AMD64_ARCHIVE" "$ARM64_ARCHIVE" "$ARMV7_ARCHIVE"; do
              if [ -f "$asset" ] && ! grep -Fxq "$(basename "$asset")" /tmp/release-assets.txt; then
                UPLOAD_ARGS+=("$asset")
              fi
            done

            if [ "${#UPLOAD_ARGS[@]}" -gt 0 ]; then
              gh release upload "$RELEASE_TAG" "${UPLOAD_ARGS[@]}"
            else
              echo "All release assets are already present; nothing to upload."
            fi
          else
            UPLOAD_ARGS=("$BOM_FILE")
            for archive in "$AMD64_ARCHIVE" "$ARM64_ARCHIVE" "$ARMV7_ARCHIVE"; do
              if [ -f "$archive" ]; then
                UPLOAD_ARGS+=("$archive")
              fi
            done

            gh release create "$RELEASE_TAG" \
              --target "${GITHUB_SHA}" \
              --title "FFmpeg $RELEASE_TAG" \
              --notes-file "$RELEASE_NOTES_FILE" \
              "${UPLOAD_ARGS[@]}"
          fi
